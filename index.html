<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Munich (also known as Maewnic; Witthawin Batsomboon), a Digital Media creative in Melbourne exploring immersive experiences, visual storytelling and digital environments.">
  <meta name="keywords" content="Munich, Maewnic, Witthawin Batsomboon, Digital Media, RMIT, Melbourne, portfolio">
  <title>Munich</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* intro animation: once per visit, skipped for reduced motion. Set here so
       nothing flashes before main.js runs; if main.js never starts it, the
       page is shown normally after 3 seconds. */
    (function () {
      try {
        if (sessionStorage.getItem("munich-intro") || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var d = document.documentElement;
        d.classList.add("intro");
        setTimeout(function () { if (!window.__introRunning) d.classList.remove("intro"); }, 3000);
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="home">
  <div id="site-header"></div>
  <main class="home">
    <div class="sky" aria-hidden="true"></div>

    <section class="container hero-wrap">
     <div class="hero glass">
      <div class="hero-text">
        <p class="eyebrow reveal">Digital Media creative</p>
        <h1 class="reveal" id="hero-title"></h1>
        <p class="lead reveal" id="hero-intro"></p>
        <p class="hero-loc reveal" id="hero-loc"></p>
        <div class="btn-row reveal">
          <a class="btn btn--ghost" href="about.html">About Me</a>
        </div>
      </div>
      <div class="hero-visual reveal" id="hero-visual"></div>
     </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
